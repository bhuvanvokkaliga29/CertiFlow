name: CertiFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint
        working-directory: ./backend
        run: |
          ruff check .

      - name: Run Pytest Suite
        working-directory: ./backend
        run: |
          python -m pytest tests/test_certiflow.py -v

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        env:
          NODE_ENV: development
        run: |
          rm -f package-lock.json
          npm install --include=dev --legacy-peer-deps

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          npm test 2>&1 | tee test_output.log || (echo "### Vitest Failure Output" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat test_output.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Run Production Build
        working-directory: ./frontend
        run: |
          npm run build
